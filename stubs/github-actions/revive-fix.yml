name: Revive Fix

# Commits made in here will not trigger any workflows
# Checkout Revive's documentation for a workaround

on:
    push:
        branches: [ YOUR_BRANCH_NAME ]
    pull_request:

jobs:
  revive:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: "Revive Fix"
        uses: devanoxltd/revive-action@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Revive Fix
        run: ./vendor/bin/revive fix

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Revive Fix
          commit_user_name: GitHub Action
          commit_user_email: actions@github.com
